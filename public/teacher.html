<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giáo viên · EngLive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/classes.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main" id="overview">
      <div class="mbar">
        <button class="icon-btn" data-menu aria-label="Menu"><i data-lucide="menu"></i></button>
        <a href="/" class="brand"><span>Eng<b>Live</b></span></a>
        <button class="btn btn-primary btn-sm" id="newClassBtn"><i data-lucide="plus"></i> Tạo lớp</button>
      </div>

      <section id="classCollection">
      <div class="stats" id="stats"></div>
      <div class="section-title" id="classes"><h2>Lớp học của tôi</h2><button class="btn btn-outline btn-sm" id="zoomConnectBtn" title="Liên kết tài khoản Zoom một lần để mở cuộc họp ngay trong web"><i data-lucide="link"></i> Liên kết Zoom</button></div>
      <div id="classTools"></div>
      <div class="class-grid" id="classGrid"></div>
      <nav class="catalog-pagination" id="classPagination" aria-label="Phân trang lớp học"></nav>
      </section>
      <section id="classDetail" class="catalog-detail" hidden>
        <button class="btn btn-outline catalog-back" id="backToClasses"><i data-lucide="arrow-left"></i> Danh sách lớp</button>
        <div id="detail"></div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/zoom-urls.js"></script>
  <script src="/js/class-directory.js"></script>
  <script src="/js/teacher.js"></script>
</body>
</html>
