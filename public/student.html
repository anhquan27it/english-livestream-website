<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Học sinh · EngLive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/classes.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main" id="top">
      <div class="topbar">
        <div style="display:flex;gap:12px;align-items:center">
          <button class="icon-btn mobile-only" data-menu aria-label="Menu"><i data-lucide="menu"></i></button>
          <div><h1 id="hello"></h1><p>Let's learn something new today.</p></div>
        </div>
        <div class="topbar-actions"><button class="btn btn-primary" id="joinBtn"><i data-lucide="key-round"></i> Nhập mã lớp</button></div>
      </div>

      <div id="liveNow"></div>

          <div class="stats stats-3" id="stats"></div>
          <div class="section-title" id="classes"><h2>Lớp học của tôi</h2></div>
          <div id="classTools"></div>
          <div class="class-grid" id="classGrid"></div>
          <nav class="catalog-pagination" id="classPagination" aria-label="Phân trang lớp học"></nav>
        <aside class="class-extras">
          <div class="word-card" id="wordCard"></div>
          <div class="card">
            <div class="section-title" style="margin-top:0"><h2>Mẹo khi học live</h2></div>
            <div class="history-item"><div class="ic tone-violet">🎧</div><div><b>Đeo tai nghe</b><small>Nghe rõ phát âm của giáo viên hơn</small></div></div>
            <div class="history-item"><div class="ic tone-orange">✋</div><div><b>Giơ tay khi có câu hỏi</b><small>Giáo viên sẽ thấy ngay</small></div></div>
            <div class="history-item"><div class="ic tone-mint">✍️</div><div><b>Chat bằng tiếng Anh</b><small>Luyện viết phản xạ mỗi buổi</small></div></div>
          </div>
        </aside>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/class-directory.js"></script>
  <script src="/js/student.js"></script>
</body>
</html>
