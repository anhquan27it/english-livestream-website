<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lớp học trực tiếp · EngLive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/studio.css" />
  <link rel="stylesheet" href="/css/zoom.css" />
</head>
<body class="live-body">
  <div class="live-app">
    <section class="stage-wrap">
      <div class="live-top">
        <div class="left">
          <button class="back" id="backBtn" title="Rời phòng"><i data-lucide="arrow-left"></i></button>
          <div style="min-width:0">
            <h1 id="liveTitle">Đang tải...</h1>
            <small id="liveSub"></small>
          </div>
        </div>
        <div class="right">
          <button class="badge-dark code-chip" id="codeChip" type="button" hidden data-tip="Mã lớp: bấm để sao chép gửi học sinh" aria-label="Mã lớp"><i data-lucide="key-round"></i><b id="codeText"></b></button>
          <button class="tbtn" id="sideToggle" aria-label="Ẩn/hiện khung chat" data-tip="Ẩn/hiện khung chat"><i data-lucide="panel-right-close"></i></button>
          <span class="badge-dark" id="speakerBadge" hidden style="background:rgba(18,185,129,.35)"></span>
          <span class="badge-live" id="liveBadge" hidden>LIVE</span>
          <span class="badge-dark" id="timer"><i data-lucide="clock"></i> 00:00</span>
          <span class="badge-dark"><i data-lucide="eye"></i> <span id="viewerCount">0</span></span>
        </div>
      </div>

      <div class="stage" id="stage">
        <video id="video" playsinline autoplay></video>
        <div id="zoomHost" hidden></div>
        <div class="spk-tile" id="spkTile" hidden><video id="spkCam" playsinline autoplay muted></video><span id="spkName"></span></div>
        <div class="spk-note" id="spkNote" hidden></div>
        <div class="slide-layer" id="slideLayer"></div>
        <div id="reactLayer"></div>
        <div id="captions" hidden></div>
        <button class="btn btn-sm btn-outline swap-btn" id="swapBtn" title="Đổi vị trí video và slide"><i data-lucide="repeat-2"></i> Đổi khung</button>
        <div class="word-overlay" id="wordOverlay" hidden></div>
        <div class="stage-state" id="stageState">
          <div><div class="spinner"></div><h2>Đang kết nối...</h2></div>
        </div>
      </div>

      <div class="controls" id="controls"></div>
      <p id="zoomNotice" class="zoom-notice" role="status" hidden></p>
    </section>

    <aside class="side-panel">
      <div class="side-resizer" id="sideResizer" role="separator" aria-orientation="vertical" aria-label="Kéo để đổi độ rộng khung chat" title="Kéo để đổi độ rộng · bấm đúp để đặt lại"></div>
      <div class="panel-tabs">
        <button class="active" data-panel="chat" data-tip="Chat" aria-label="Chat"><i data-lucide="message-circle"></i></button>
        <button data-panel="lesson" id="tabLesson" data-tip="Bài giảng" aria-label="Bài giảng" hidden><i data-lucide="presentation"></i></button>
        <button data-panel="breakout" id="tabBo" data-tip="Nhóm" aria-label="Nhóm" hidden><i data-lucide="users-round"></i></button>
        <button data-panel="pad" id="tabPad" data-tip="Bảng viết" aria-label="Bảng viết" hidden><i data-lucide="pen-line"></i></button>
        <button data-panel="ai" id="tabAi" data-tip="Hỏi AI" aria-label="Hỏi AI" hidden><i data-lucide="bot"></i></button>
        <button data-panel="people" id="tabPeople" data-tip="Học sinh" aria-label="Học sinh"><i data-lucide="users"></i><span class="count" id="peopleCount">0</span><span id="peopleLabel" hidden>Học sinh</span></button>
      </div>
      <div class="panel-body" id="chatPanel"><div class="chat-list" id="chatList"></div></div>
      <div class="panel-body" id="peoplePanel" hidden></div>
      <div class="panel-body" id="lessonPanel" hidden></div>
      <div class="panel-body" id="boPanel" hidden></div>
      <div class="panel-body" id="padPanel" hidden></div>
      <div class="panel-body" id="aiPanel" hidden style="padding:0"></div>
      <div id="chatBox">
        <div class="quick" id="quick"></div>
        <form class="chat-form" id="chatForm">
          <input id="chatInput" maxlength="500" placeholder="Type a message in English..." autocomplete="off" />
          <button aria-label="Gửi"><i data-lucide="send"></i></button>
        </form>
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/live-layout.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="/js/vendor/livekit-client.umd.js"></script>
  <script src="/js/vendor/fix-webm-duration.js"></script>
  <script src="/js/mixer.js"></script>
  <script src="/js/slides.js"></script>
  <script src="/js/aichat.js"></script>
  <script src="/js/lesson-live.js"></script>
  <script src="/js/pad.js"></script>
  <script src="/js/pdf-live.js"></script>
  <script src="/js/lk-live.js"></script>
  <script src="/js/zoom-live.js"></script>
  <script src="/js/breakout.js"></script>
  <script src="/js/live.js"></script>
</body>
</html>
